[project]
name = "edm-file-loader"
version= "1.0.0"
description = "Perform Analytics on the EDM Source System"
readme ="README.md"
requires-python = "~=3.11.0"
dependencies = [
    "aws-cdk-lib==2.208.0",
    "constructs>=10.0.0,<11.0.0",
    "boto3 >=1.40.67",
    "requests",
    "pandas >= 2.3.3"

]

[tool.ruff]
line-length=150
target-version ="py311"
exclude = ["temp/*"]
